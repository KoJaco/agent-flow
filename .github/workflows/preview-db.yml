# Per-PR disposable Neon branch in the STAGING project. Verify neonctl flags against current docs.
name: preview-db
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency:
  group: preview-db-${{ github.event.number }}
permissions:
  contents: read
env:
  NEON_API_KEY: ${{ secrets.NEON_API_KEY_STAGING }}      # scoped to the staging project only
  NEON_PROJECT_ID: ${{ vars.NEON_STAGING_PROJECT_ID }}
  BRANCH: pr-${{ github.event.number }}
# Inert until NEON_STAGING_PROJECT_ID is set as a repo variable.
jobs:
  create:
    if: github.event.action != 'closed' && vars.NEON_STAGING_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: api/go.mod }
      - name: Create or reuse branch
        run: |
          npx -y neonctl@8.4.1 branches get "$BRANCH" --project-id "$NEON_PROJECT_ID" \
            || npx -y neonctl@8.4.1 branches create --project-id "$NEON_PROJECT_ID" --name "$BRANCH" --parent main
      - name: Migrate preview branch
        run: |
          DATABASE_URL=$(npx -y neonctl@8.4.1 connection-string "$BRANCH" --project-id "$NEON_PROJECT_ID" --pooled)
          echo "::add-mask::$DATABASE_URL"
          go install github.com/pressly/goose/v3/cmd/goose@v3.29.0
          goose -dir db/migrations postgres "$DATABASE_URL" up
  delete:
    if: github.event.action == 'closed' && vars.NEON_STAGING_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - run: npx -y neonctl@8.4.1 branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID"
